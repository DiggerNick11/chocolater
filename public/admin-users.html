<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User | Admin</title>
  <link rel="stylesheet" href="css/style.css" />
  <script defer src="js/admin.js"></script>
</head>
<body>
  <div class="admin-layout">
    <div id="adminSidebarBox"></div>

    <main class="admin-main">
      <div class="admin-topbar">
        <div>
          <button class="btn btn-outline mobile-admin-toggle" id="mobileAdminToggle">
            ☰ Menu
          </button>
          <h1>Data User</h1>
          <p>Kelola akun admin dan customer.</p>
        </div>

        <a href="admin-user-form.html" class="btn-add-admin">+ Tambah User</a>
      </div>

      <section class="table-card">
        <table class="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nama</th>
              <th>Email</th>
              <th>No HP</th>
              <th>Role</th>
              <th>Status</th>
              <th>Tanggal</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="usersTable"></tbody>
        </table>
      </section>
    </main>
  </div>
</body>
</html>
