<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | ChocoLater Store</title>
  <link rel="stylesheet" href="css/style.css"><script defer src="js/app.js"></script>
</head>
<body>
  <div id="header"></div>
  <main class="container auth-wrap">
    <section class="auth-card">
      <p class="eyebrow">Masuk Akun</p><h1 style="font-size:44px">Login</h1>
      <div class="alert"><b>Silahkan Masukan Email dan Password Anda</b></div>
      <form id="loginForm" class="form-grid">
        <div class="form-field full"><label>Email</label><input class="input" type="email" name="email" required></div>
        <div class="form-field full"><label>Password</label><input class="input" type="password" name="password" required></div>
        <div class="form-field full"><button class="btn btn-primary full-width" type="submit">Login</button></div>
      </form>
      <p>Belum punya akun? <a href="register.html"><b>Daftar sebagai customer</b></a></p>
    </section>
  </main>
</body>
</html>
