<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product | ChocoLater Store</title>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/app.js"></script>
</head>
<body>
<div id="header"></div>

  <main class="container page-section">
    <div class="page-heading">
      <p class="eyebrow">Daftar Produk</p>
      <h1>Pilih minuman coklat susu favoritmu</h1>
    </div>

    <div class="toolbar">
      <input type="search" id="productSearch" placeholder="Cari produk...">
      <select id="categoryFilter">
        <option value="all">Semua kategori</option>
      </select>
    </div>

    <section class="product-grid" id="productList">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <footer class="footer">
    <div class="container footer-content">
      <p>© 2026 ChocoLater Store.</p>
      <p>Belanja cepat, langsung lanjut WhatsApp.</p>
    </div>
  </footer>
</body>
</html>
