<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Member | ChocoLater Store</title>
  <link rel="stylesheet" href="css/style.css"><script defer src="js/app.js"></script>
</head>
<body>
  <div id="header"></div>
  <main class="container auth-wrap">
    <section class="auth-card">
      <p class="eyebrow">Customer</p><h1 style="font-size:44px">Daftar Member</h1>
      <p>Customer yang mendaftar akan otomatis masuk ke data member admin.</p>
      <form id="registerForm" class="form-grid">
        <div class="form-field full"><label>Nama</label><input class="input" name="name" required></div>
        <div class="form-field full"><label>Email</label><input class="input" type="email" name="email" required></div>
        <div class="form-field full"><label>No HP</label><input class="input" name="phone" required></div>
        <div class="form-field full"><label>Alamat</label><textarea class="textarea" name="address" rows="3"></textarea></div>
        <div class="form-field full"><label>Password</label><input class="input" type="password" name="password" required></div>
        <div class="form-field full"><button class="btn btn-primary full-width" type="submit">Daftar</button></div>
      </form>
      <p>Sudah punya akun? <a href="login.html"><b>Login</b></a></p>
    </section>
  </main>
</body>
</html>
