<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin | ChocoLater Store</title>
  <link rel="stylesheet" href="css/style.css"><script defer src="js/admin.js"></script>
</head>
<body>
  <div class="admin-layout">
    <div id="adminSidebarBox"></div>
    <main class="admin-main">
      <div class="admin-topbar no-print">
        <div><button class="btn btn-outline mobile-admin-toggle" id="mobileAdminToggle">☰ Menu</button><h1>Dashboard</h1><p>Statistik penjualan dihitung langsung dari data database.</p></div>
        <button class="btn btn-primary" type="button" id="printDashboardBtn">Cetak Dashboard</button>
      </div>
      <section class="stats-grid no-print" id="dashboardStats">
        <div class="stat-card"><div class="stat-label">Total Penjualan</div><div class="stat-value" id="statIncome">Rp0</div></div>
        <div class="stat-card green"><div class="stat-label">Total Order</div><div class="stat-value" id="statOrders">0</div></div>
        <div class="stat-card yellow"><div class="stat-label">Pending Request</div><div class="stat-value" id="statPending">0</div></div>
        <div class="stat-card"><div class="stat-label">Member</div><div class="stat-value" id="statMembers">0</div></div>
        <div class="stat-card"><div class="stat-label">Produk/Menu</div><div class="stat-value" id="statProducts">0</div></div>
        <div class="stat-card red"><div class="stat-label">Pesan Baru</div><div class="stat-value" id="statMessages">0</div></div>
      </section>
      <section class="dashboard-grid no-print">
        <div class="chart-card"><div class="chart-title"><h3>Sales Overview</h3><span class="pill">12 bulan terakhir</span></div><div id="salesChart"></div></div>
        <div class="chart-card"><div class="chart-title"><h3>Produk Terjual</h3><span class="pill">Database</span></div><div class="donut" id="productDonut"></div><div class="legend" id="productLegend"></div></div>
      </section>

      <section class="table-card report-print-area print-only" id="dashboardPrintBox"></section>
    </main>
  </div>
</body>
</html>
