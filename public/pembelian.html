<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembelian | ChocoLater Store</title>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/app.js"></script>
</head>
<body>
<div id="header"></div>
  <main class="container page-section">
    <div class="page-heading">
      <p class="eyebrow">Checkout</p>
      <h1>Lengkapi data pembelian</h1>
      <p>Pilih produk, isi data pelanggan, lalu lanjutkan pembayaran melalui WhatsApp atau scan QRIS.</p>
    </div>

    <section class="checkout-layout">
      <div class="cart-panel">
        <h2>Keranjang</h2>
        <div id="cartItems" class="cart-list"></div>
        <div class="cart-summary">
          <span>Total</span>
          <strong id="cartTotal">Rp0</strong>
        </div>
        <a class="btn btn-outline full-width" href="product.html">Tambah Produk</a>
      </div>

      <form class="form-card" id="checkoutForm">
        <h2>Data Pelanggan</h2>
        <label>
          Nama Lengkap
          <input type="text" name="customer_name" placeholder="Masukkan nama" required>
        </label>
        <label>
          Nomor WhatsApp
          <input type="tel" name="phone" placeholder="Contoh: 08123456789" required>
        </label>
        <label>
          Alamat Lengkap
          <textarea name="address" rows="4" placeholder="Masukkan alamat pengiriman" required></textarea>
        </label>
        <label>
          Catatan Tambahan
          <textarea name="notes" rows="3" placeholder="Contoh: jangan terlalu manis"></textarea>
        </label>

        <div class="payment-method-group">
          <h3>Metode Pembayaran</h3>
          <label class="payment-option">
            <input type="radio" name="payment_method" value="whatsapp" checked>
            <span class="payment-option-icon" aria-hidden="true"><svg viewBox="0 0 64 64" class="color-icon" role="img"><circle cx="32" cy="32" r="24" fill="#22C55E"/><path d="M20 48l3.2-9A17 17 0 1 1 31 43.8L20 48Z" fill="#DCFCE7"/><path d="M25 23c1-1.5 2.7-1.3 3.4.2l1.2 2.8c.3.7.1 1.4-.5 1.9l-1 .8c1.8 3.3 4.3 5.7 7.6 7.3l.8-1.1c.5-.6 1.3-.8 2-.4l2.7 1.3c1.5.7 1.7 2.3.3 3.3-1.5 1.2-3.6 1.5-5.6.9-6.2-1.9-10.8-6.3-12.8-12.5-.6-1.8-.2-3.5 1.9-4.5Z" fill="#16A34A"/></svg></span>
            <span>
              <strong>Chat WhatsApp</strong>
              <small>Pesanan langsung diarahkan ke WhatsApp untuk konfirmasi.</small>
            </span>
          </label>
          <label class="payment-option">
            <input type="radio" name="payment_method" value="qris">
            <span class="payment-option-icon" aria-hidden="true"><svg viewBox="0 0 64 64" class="color-icon" role="img"><rect x="8" y="8" width="20" height="20" rx="5" fill="#2563EB"/><rect x="14" y="14" width="8" height="8" rx="2" fill="#DBEAFE"/><rect x="36" y="8" width="20" height="20" rx="5" fill="#F97316"/><rect x="42" y="14" width="8" height="8" rx="2" fill="#FFEDD5"/><rect x="8" y="36" width="20" height="20" rx="5" fill="#16A34A"/><rect x="14" y="42" width="8" height="8" rx="2" fill="#DCFCE7"/><path d="M38 38h6v6h-6v-6Zm10 0h8v18h-8v-6h-4v-6h4v-6Zm-12 10h6v8h-6v-8Z" fill="#111827"/></svg></span>
            <span>
              <strong>Scan QRIS</strong>
              <small>Customer scan QRIS, lalu lanjut WhatsApp untuk kirim bukti bayar.</small>
            </span>
          </label>
        </div>

        <button class="btn btn-primary full-width" type="submit">Buat Pesanan</button>
      </form>
    </section>

    <section class="payment-result" id="paymentResult" hidden></section>
  </main>

  <div class="toast" id="toast"></div>

  <footer class="footer">
    <div class="container footer-content">
      <p>© 2026 ChocoLater Store.</p>
    </div>
  </footer>
</body>
</html>
